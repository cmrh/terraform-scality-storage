name: lint

on:
  push:
    branches: [main]
  pull_request:

env:
  TOFU_VERSION: "1.10.0"
  TFLINT_VERSION: "0.55.0"

jobs:
  fmt:
    name: tofu fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenTofu
        run: |
          set -euo pipefail
          curl -fsSLo /tmp/tofu.zip \
            "https://github.com/opentofu/opentofu/releases/download/v${TOFU_VERSION}/tofu_${TOFU_VERSION}_linux_amd64.zip"
          sudo unzip -j -q -o /tmp/tofu.zip tofu -d /usr/local/bin/
          sudo chmod +x /usr/local/bin/tofu
          tofu --version

      - name: Check formatting
        run: tofu fmt -check -recursive

  tflint:
    name: tflint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tflint
        run: |
          set -euo pipefail
          curl -fsSLo /tmp/tflint.zip \
            "https://github.com/terraform-linters/tflint/releases/download/v${TFLINT_VERSION}/tflint_linux_amd64.zip"
          sudo unzip -j -q -o /tmp/tflint.zip tflint -d /usr/local/bin/
          sudo chmod +x /usr/local/bin/tflint
          tflint --version

      - name: Initialize tflint
        run: tflint --init

      - name: Run tflint
        run: tflint --recursive --format compact

  # `tofu validate` is intentionally absent: the scality provider is not yet
  # published to a public registry, so `tofu init` cannot fetch it. Re-add a
  # `validate` job (init -backend=false + validate per module) once the
  # provider is on the public registry, or wire in a dev_overrides /
  # release-binary install step.
