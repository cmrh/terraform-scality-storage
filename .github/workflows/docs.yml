name: docs

on:
  pull_request:
    paths:
      - "**.md"
      - mkdocs.yml
      - .github/docs-requirements.txt
      - .github/scripts/docs-build.py
      - .github/workflows/docs.yml
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a deploy halfway; PR builds share the group per ref.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install MkDocs
        run: pip install -r .github/docs-requirements.txt

      # Links to files outside the site point at GitHub, at the tag being
      # deployed (main for PR builds).
      - name: Build site
        run: make docs DOCS_REF="${{ github.event_name == 'pull_request' && 'main' || github.ref_name }}"

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: build/site

  deploy:
    name: docs deploy
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
