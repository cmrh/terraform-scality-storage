name: integration

on:
  release:
    types: [published]
  workflow_dispatch:

# Serialize integration runs — only one apply/destroy cycle against the
# shared test clusters at a time.
concurrency:
  group: integration-clusters
  cancel-in-progress: false

jobs:
  integration:
    name: apply + destroy
    runs-on: tf-module-runner
    environment: integration-clusters
    env:
      # Default scality provider reads credentials from these env vars.
      SCALITY_ENDPOINT:   ${{ vars.SCALITY_PRIMARY_ENDPOINT }}
      SCALITY_ACCESS_KEY: ${{ secrets.SCALITY_PRIMARY_ACCESS_KEY }}
      SCALITY_SECRET_KEY: ${{ secrets.SCALITY_PRIMARY_SECRET_KEY }}

      # Bidirectional CRR example reads the destination cluster via
      # explicit TF_VAR_dest_* inputs (see examples/scality/s3-crr/bidirectional/provider.tf).
      TF_VAR_dest_endpoint:   ${{ vars.SCALITY_DR_ENDPOINT }}
      TF_VAR_dest_access_key: ${{ secrets.SCALITY_DR_ACCESS_KEY }}
      TF_VAR_dest_secret_key: ${{ secrets.SCALITY_DR_SECRET_KEY }}

      # Per-run unique account name for operator-test to avoid collisions
      # if a previous run failed to clean up.
      TF_VAR_account_name: "ci-${{ github.run_id }}-operator-test"

      # Same idea for the s3-crr examples: a per-run prefix on every account /
      # bucket / user name so a failed destroy can't collide with the next run.
      TF_VAR_name_prefix: "ci-${{ github.run_id }}-"

    steps:
      - uses: actions/checkout@v4

      - name: Download scality provider release
        env:
          GH_TOKEN: ${{ secrets.PROVIDER_RELEASES_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/.tf-dev"
          cd "$GITHUB_WORKSPACE/.tf-dev"
          gh release download --repo scality/terraform-provider-scality \
            --pattern '*linux_amd64.zip' --output provider.zip --clobber
          unzip -o provider.zip
          mv terraform-provider-scality_v* terraform-provider-scality
          chmod +x terraform-provider-scality

      - name: Configure dev_overrides
        run: |
          set -euo pipefail
          cat > "$GITHUB_WORKSPACE/.terraformrc" <<EOF
          provider_installation {
            dev_overrides {
              "scality/scality" = "$GITHUB_WORKSPACE/.tf-dev"
            }
            direct {}
          }
          EOF
          echo "TF_CLI_CONFIG_FILE=$GITHUB_WORKSPACE/.terraformrc" >> "$GITHUB_ENV"

      # ============================================================
      # operator-test — operator pattern lifecycle regression
      # ============================================================
      - name: operator-test — apply
        id: opt_apply
        working-directory: examples/scality/operator-test
        run: |
          set -euo pipefail
          tofu get # dev_overrides supplies the provider; `tofu init` would query the registry and fail
          tofu apply -auto-approve

      - name: operator-test — destroy
        if: always() && steps.opt_apply.outcome != 'skipped'
        working-directory: examples/scality/operator-test
        run: tofu destroy -auto-approve

      # ============================================================
      # s3-crr one-direction
      # ============================================================
      - name: s3-crr one-direction — apply
        id: crr1_apply
        working-directory: examples/scality/s3-crr/one-direction
        run: |
          set -euo pipefail
          tofu get # dev_overrides supplies the provider; `tofu init` would query the registry and fail
          tofu apply -auto-approve

      - name: s3-crr one-direction — destroy
        if: always() && steps.crr1_apply.outcome != 'skipped'
        working-directory: examples/scality/s3-crr/one-direction
        run: tofu destroy -auto-approve

      # ============================================================
      # s3-crr bidirectional
      # ============================================================
      - name: s3-crr bidirectional — apply
        id: crr2_apply
        working-directory: examples/scality/s3-crr/bidirectional
        run: |
          set -euo pipefail
          tofu get # dev_overrides supplies the provider; `tofu init` would query the registry and fail
          tofu apply -auto-approve

      - name: s3-crr bidirectional — destroy
        if: always() && steps.crr2_apply.outcome != 'skipped'
        working-directory: examples/scality/s3-crr/bidirectional
        run: tofu destroy -auto-approve
