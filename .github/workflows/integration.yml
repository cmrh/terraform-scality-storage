name: integration

# Live-cluster check on the self-hosted runner: example configurations apply,
# re-plan with no changes, and destroy. No data-path tests, and not a release
# gate. Allowed triggers only (see runner-guard).
on:
  workflow_dispatch:
    inputs:
      configs:
        description: "Space-separated configs to run (empty = all)"
        required: false
        default: ""
  # Sent by a provider's release workflow:
  # client_payload: { "provider": "scality" | "artesca", "version": "x.y.z" }
  repository_dispatch:
    types: [provider-release]

permissions:
  contents: read

# One run at a time against the shared clusters.
concurrency:
  group: integration-clusters
  cancel-in-progress: false

# Keep in step with validate.yml.
env:
  TERRAFORM_VERSION: "1.16.4"

jobs:
  integration:
    name: apply, re-plan, destroy
    runs-on: tf-module-runner
    environment: integration-clusters
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Run suite
        env:
          ENGINE: terraform
          CONFIGS: ${{ inputs.configs }}
          PROVIDER_NAME: ${{ github.event.client_payload.provider }}
          PROVIDER_VERSION: ${{ github.event.client_payload.version }}
          RUN_PREFIX: ci${{ github.run_id }}${{ github.run_attempt }}
          SCALITY_ENDPOINT: ${{ vars.SCALITY_PRIMARY_ENDPOINT }}
          SCALITY_ACCESS_KEY: ${{ secrets.SCALITY_PRIMARY_ACCESS_KEY }}
          SCALITY_SECRET_KEY: ${{ secrets.SCALITY_PRIMARY_SECRET_KEY }}
          TF_VAR_dest_endpoint: ${{ vars.SCALITY_DR_ENDPOINT }}
          TF_VAR_dest_access_key: ${{ secrets.SCALITY_DR_ACCESS_KEY }}
          TF_VAR_dest_secret_key: ${{ secrets.SCALITY_DR_SECRET_KEY }}
          ARTESCA_MANAGEMENT_ENDPOINT: ${{ vars.ARTESCA_MANAGEMENT_ENDPOINT }}
          ARTESCA_OIDC_URL: ${{ vars.ARTESCA_OIDC_URL }}
          ARTESCA_S3_ENDPOINT: ${{ vars.ARTESCA_S3_ENDPOINT }}
          ARTESCA_INSECURE_SKIP_VERIFY: ${{ vars.ARTESCA_INSECURE_SKIP_VERIFY }}
          ARTESCA_USERNAME: ${{ vars.ARTESCA_USERNAME }}
          ARTESCA_PASSWORD: ${{ secrets.ARTESCA_PASSWORD }}
        run: .github/scripts/integration.sh
