name: validate

on:
  push:
    branches: [main]
  pull_request:

# Run JS actions (e.g. actions/checkout) on the Node 24 runtime — silences the
# Node-version deprecation warning.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  fmt:
    name: tofu fmt
    runs-on: tf-module-runner
    steps:
      - uses: actions/checkout@v4

      - name: Check formatting
        run: tofu fmt -check -recursive

  tflint:
    name: tflint
    runs-on: tf-module-runner
    steps:
      - uses: actions/checkout@v4

      - name: Initialize tflint
        run: tflint --init

      - name: Run tflint
        run: tflint --recursive --format compact

  validate:
    name: tofu validate
    runs-on: tf-module-runner
    steps:
      - uses: actions/checkout@v4

      - name: tofu validate (modules)
        run: |
          set -euo pipefail
          for dir in modules/scality/*/; do
            echo "::group::$dir"
            # init pulls the scality provider from the public registry;
            # -backend=false so validation needs no backend credentials.
            (cd "$dir" && tofu init -backend=false && tofu validate)
            echo "::endgroup::"
          done

      - name: tofu validate (examples)
        run: |
          set -euo pipefail
          find examples -mindepth 2 -name main.tf -printf "%h\n" | while read -r dir; do
            echo "::group::$dir"
            (cd "$dir" && tofu init -backend=false && tofu validate)
            echo "::endgroup::"
          done
