name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# One run per ref; a new push to a PR supersedes the previous run.
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

# Pinned tool versions. Every module and example must pass under both
# engines. Jobs call the Makefile targets so CI and `make check` stay identical.
env:
  TOFU_VERSION: "1.12.6"
  TERRAFORM_VERSION: "1.16.4"
  TFLINT_VERSION: "v0.64.0"

jobs:
  fmt:
    name: fmt (${{ matrix.engine }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [tofu, terraform]
    steps:
      - uses: actions/checkout@v7

      - uses: opentofu/setup-opentofu@v2
        if: matrix.engine == 'tofu'
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false

      - uses: hashicorp/setup-terraform@v4
        if: matrix.engine == 'terraform'
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Check formatting
        run: make fmt-check ENGINE=${{ matrix.engine }}

  tflint:
    name: tflint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}

      - name: Run tflint
        run: make lint
        env:
          # Avoids GitHub API rate limits when tflint --init fetches plugins.
          GITHUB_TOKEN: ${{ github.token }}

  validate:
    name: validate (${{ matrix.engine }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [tofu, terraform]
    steps:
      - uses: actions/checkout@v7

      - uses: opentofu/setup-opentofu@v2
        if: matrix.engine == 'tofu'
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false

      - uses: hashicorp/setup-terraform@v4
        if: matrix.engine == 'terraform'
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Validate modules and examples
        run: make validate ENGINE=${{ matrix.engine }}
